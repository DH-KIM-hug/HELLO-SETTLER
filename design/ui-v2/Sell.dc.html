<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>종이배 — 주민 판매</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#252122;text-decoration:none}a:hover{color:#3e5c2c}

@font-face{font-family:'Galmuri11';src:url(/_blob/e321ae828107592b5028f589f9653a1c) format('woff2');font-weight:400}
@font-face{font-family:'Galmuri11';src:url(/_blob/200361b0289ace4e3d5666f90ae5c51e) format('woff2');font-weight:700}
*{font-family:'Galmuri11',monospace !important;-webkit-font-smoothing:none;letter-spacing:0 !important}
[style*="border-radius"]{border-radius:0 !important}
svg{shape-rendering:crispEdges}
button,a[style*="min-height"]{box-shadow:inset -3px -3px 0 rgba(0,0,0,.30),inset 3px 3px 0 rgba(255,255,255,.30) !important}
[style*="border: 1px solid"],[style*="border: 1.5px solid"]{border-width:2px !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; color: #252122; background: #a7bbdb; display: flex; flex-direction: column">
  <div style="position: relative; height: 230px; background: #a7bbdb; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #608baf"></div>
    <div style="position: absolute; left: 0; width: 120px; bottom: 54px; height: 22px; background: #6e452f"></div>
    <div style="position: absolute; left: 70px; width: 70px; bottom: 60px; height: 8px; background: #a66f3c"></div>
    <svg style="position: absolute; left: 150px; bottom: 48px" width="120" height="70" viewBox="0 0 120 70" role="img" aria-label="나루터에 떠 있는 거인의 종이배">
      <path d="M6 40 L 114 40 L 92 62 L 28 62 Z" fill="#fffbea" stroke="#a49b9a" stroke-width="2"></path>
      <path d="M60 4 L 60 40 L 92 40 Z" fill="#fffbea" stroke="#a49b9a" stroke-width="2"></path>
      <path d="M60 10 L 34 40 L 60 40 Z" fill="#e2ded8" stroke="#a49b9a" stroke-width="2"></path>
      <circle cx="46" cy="34" r="3" fill="#252122"></circle>
    </svg>
    <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: rgba(255,255,255,0.55)"></div>
    <a href="Resident.dc.html" aria-label="뒤로" style="position: absolute; left: 12px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(244,237,224,0.95); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#252122" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="position: absolute; right: 12px; top: 18px; padding: 8px 12px; border-radius: 999px; background: rgba(244,237,224,0.95); font-size: 12px; font-weight: 700">오늘 떠난 사람 1 / 3</div>
  </div>

  <div style="flex: 1; margin-top: -20px; background: #e2ded8; border-radius: 24px 24px 0 0; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700">거인의 종이배</span>
      <span style="font-size: 13px; color: #3a3537">종이배를 타고 떠난 사람은 돌아오지 않아요.</span>
    </div>

    <div role="radiogroup" aria-label="누가 떠나나요" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" role="radio" aria-checked="{{aloneSel}}" onClick="{{pickAlone}}" style="{{aloneStyle}}">
        <span style="font-size: 14px; font-weight: 700">한스 혼자</span>
        <span style="font-size: 12px; color: #3a3537">가족은 마을에 남아요</span>
      </button>
      <button type="button" role="radio" aria-checked="{{familySel}}" onClick="{{pickFamily}}" style="{{familyStyle}}">
        <span style="font-size: 14px; font-weight: 700">가족 모두</span>
        <span style="font-size: 12px; color: #3a3537">아이들은 함께 가요 (대금 없음)</span>
      </button>
    </div>

    <div style="padding: 12px 14px; background: #fffbea; border: 1px solid #b6b0b1; border-radius: 14px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="color: #3a3537">{{l.label}}</span><span style="font-weight: 700">{{l.value}}</span>
        </div>
      </sc-for>
      <div style="height: 1px; background: #cdc6c4"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 14px; font-weight: 700">받는 지폐</span>
        <span style="font-size: 24px; font-weight: 700; color: #324c28">{{total}}</span>
      </div>
    </div>

    <div style="padding: 10px 14px; background: #eac79c; border: 1px solid #c99f73; border-radius: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; color: #b54023">마을에 생기는 일</span>
      <sc-for list="{{effects}}" as="e" hint-placeholder-count="3">
        <span style="font-size: 13px; color: #3a3537">· {{e}}</span>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; gap: 10px">
      <a href="Resident.dc.html" style="flex: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; border: 1.5px solid #3e5c2c; font-size: 15px; font-weight: 700; color: #324c28">그만두기</a>
      <a href="Main.dc.html" style="flex: 1.4; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #252122; font-size: 15px; font-weight: 700; color: #e2ded8">종이배 띄우기</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { family: false }; }
  renderVals() {
    const fam = this.state.family;
    const card = 'display: flex; flex-direction: column; gap: 2px; align-items: flex-start; padding: 12px; min-height: 64px; border-radius: 14px; font-family: inherit; color: #252122; cursor: pointer; text-align: left;';
    const on = 'background: #fffbea; border: 2px solid #3e5c2c';
    const off = 'background: transparent; border: 1px solid #a49b9a';
    const lines = fam
      ? [
          { label: '한스 — 희귀 ×5 · 숙련 ×1.2', value: '600' },
          { label: '마르타 — 일반 ×1 · 숙련 ×1.1', value: '110' },
          { label: '리나(6) · 토미(2) — 미성년', value: '0' },
          { label: '가족 단위 보너스', value: '+70' }
        ]
      : [
          { label: '기본가', value: '100' },
          { label: '등급 희귀', value: '×5' },
          { label: '숙련 Lv.6 · 34세', value: '×1.2' }
        ];
    const effects = fam
      ? ['대장간이 멈춰요 — 다른 대장장이가 없어요', '인구 34 → 30', '이웃들이 오래 그리워해요 (행복 -8)', '거인을 두려워하는 마음이 조금 커져요']
      : ['대장간이 멈춰요 — 제자 리나는 아직 어려요', '마르타와 아이들이 슬퍼해요 (가족 행복 -25)', '인구 34 → 33'];
    return {
      aloneSel: fam ? 'false' : 'true',
      familySel: fam ? 'true' : 'false',
      aloneStyle: card + (fam ? off : on),
      familyStyle: card + (fam ? on : off),
      pickAlone: () => this.setState({ family: false }),
      pickFamily: () => this.setState({ family: true }),
      lines,
      total: fam ? '780 지폐' : '600 지폐',
      effects
    };
  }
}
</script>
</body>
</html>
