<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>건설</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#252122;text-decoration:none}a:hover{color:#3e5c2c}

@font-face{font-family:'Galmuri11';src:url(/_blob/e321ae828107592b5028f589f9653a1c) format('woff2');font-weight:400}
@font-face{font-family:'Galmuri11';src:url(/_blob/200361b0289ace4e3d5666f90ae5c51e) format('woff2');font-weight:700}
*{font-family:'Galmuri11',monospace !important;-webkit-font-smoothing:none;letter-spacing:0 !important}
[style*="border-radius"]{border-radius:0 !important}
svg{shape-rendering:crispEdges}
button,a[style*="min-height"]{box-shadow:inset -3px -3px 0 rgba(0,0,0,.30),inset 3px 3px 0 rgba(255,255,255,.30) !important}
[style*="border: 1px solid"],[style*="border: 1.5px solid"]{border-width:2px !important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Noto Sans KR', sans-serif; color: #252122; background: #cdc6c4">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 380px; background: #cdc6c4">
    <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background-image: linear-gradient(#a49b9a 1px, transparent 1px), linear-gradient(90deg, #a49b9a 1px, transparent 1px); background-size: 28px 28px; opacity: 0.6"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: #608baf; opacity: 0.55"></div>
    <div style="position: absolute; left: 140px; top: 196px; width: 84px; height: 56px; border: 2.5px dashed #3e5c2c; border-radius: 6px; background: rgba(62,92,58,0.18); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #324c28">빵집 터</div>
    <div style="position: absolute; left: 182px; top: 252px; width: 4px; height: 90px; background: #c99f73"></div>
    <div style="position: absolute; left: 100px; top: 340px; width: 180px; height: 4px; background: #c99f73"></div>
    <div style="position: absolute; left: 20px; top: 136px; padding: 6px 10px; background: rgba(244,237,224,0.95); border-radius: 10px; font-size: 12px">반경 행복 +3 범위 표시</div>
    <div style="position: absolute; left: 112px; top: 168px; width: 140px; height: 112px; border-radius: 50%; border: 1.5px solid #8b5733; opacity: 0.7"></div>
  </div>

  <div style="position: absolute; left: 12px; top: 14px; display: flex; gap: 8px">
    <a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(244,237,224,0.95); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#252122" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="height: 44px; display: flex; align-items: center; padding: 0 14px; border-radius: 22px; background: rgba(244,237,224,0.95); font-size: 13px; font-weight: 700">건설 모드 · 터를 끌어서 놓으세요</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 360px; bottom: 0; background: #e2ded8; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 16px rgba(42,38,32,0.14); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><div style="width: 40px; height: 4px; border-radius: 2px; background: #a49b9a"></div></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 8px">
      <div style="font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700">무엇을 지을까요</div>
      <div style="display: flex; gap: 10px; font-size: 12px; color: #544e4f">
        <span>판자 <b style="color: #252122">24</b></span><span>돌 <b style="color: #252122">11</b></span>
      </div>
    </div>
    <div role="tablist" aria-label="건물 분류" style="display: flex; gap: 6px; padding: 0 14px 10px; flex-wrap: wrap">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; overflow: hidden; padding: 0 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
        <button type="button" style="{{c.style}}" aria-label="{{c.aria}}">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 15px; font-weight: 700">{{c.name}}</span>
            <span style="font-size: 11px; color: #544e4f">{{c.size}}</span>
          </div>
          <span style="font-size: 12px; color: #3a3537; text-align: left">{{c.recipe}}</span>
          <div style="display: flex; gap: 8px; font-size: 12px; color: #3a3537">
            <span>판자 {{c.plank}}</span><span>돌 {{c.stone}}</span><span>{{c.time}}</span>
          </div>
          <span style="font-size: 11px; font-weight: 700; color: {{c.noteColor}}; text-align: left">{{c.note}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: '식량' }; }
  renderVals() {
    const tabs = ['주거', '식량', '목재·석재', '광업', '생활', '군사'];
    const base = 'min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 13px; font-family: inherit; cursor: pointer;';
    const data = {
      '식량': [
        { name: '빵집', size: '중', recipe: '밀가루 1 + 물 1 → 빵 1 · 30초', plank: 2, stone: 3, time: '2분 30초', note: '반경 행복 +3', ok: true },
        { name: '방앗간', size: '중', recipe: '밀 1 → 밀가루 1 · 30초', plank: 3, stone: 3, time: '2분 30초', note: '언덕이면 풍차형', ok: true },
        { name: '농장', size: '대', recipe: '→ 밀 1 · 60초', plank: 3, stone: 1, time: '2분', note: '겨울엔 쉼', ok: true },
        { name: '어부 오두막', size: '소', recipe: '→ 생선 1 · 80초', plank: 2, stone: 0, time: '1분', note: '물가에만', ok: true },
        { name: '양돈장', size: '대', recipe: '밀 1 + 물 1 → 돼지 1', plank: 3, stone: 1, time: '2분 30초', note: '읍내 시대에 열림', ok: false },
        { name: '양조장', size: '중', recipe: '밀 1 + 물 1 → 맥주 1', plank: 2, stone: 3, time: '2분 30초', note: '읍내 시대에 열림', ok: false }
      ]
    };
    const list = data[this.state.tab] || data['식량'];
    return {
      tabs: tabs.map((t) => ({
        label: t,
        sel: t === this.state.tab ? 'true' : 'false',
        pick: () => this.setState({ tab: t }),
        style: base + (t === this.state.tab ? 'border: none; background: #3e5c2c; color: #e2ded8; font-weight: 700' : 'border: 1px solid #a49b9a; background: transparent; color: #252122')
      })),
      cards: list.map((c) => ({
        ...c,
        aria: c.name + (c.ok ? '' : ', 잠김'),
        noteColor: c.ok ? '#3e5c2c' : '#6e452f',
        style: 'display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; font-family: inherit; color: #252122; cursor: pointer; text-align: left; ' + (c.ok ? 'background: #fffbea; border: 1px solid #b6b0b1' : 'background: #b6b0b1; border: 1px dashed #a49b9a; opacity: 0.85')
      }))
    };
  }
}
</script>
</body>
</html>
