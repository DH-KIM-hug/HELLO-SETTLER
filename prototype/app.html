<title>초록방울 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 한 화면 게임: 캔버스가 화면 전체, 위·아래 가장자리에만 UI. 따뜻한 방 + 유리병 안의 세상 (단일 테마) */
:root{
  --paper:#F4EDE0; --paper-2:#E9DFCD; --ink:#2A2620; --ink-2:#5A5247;
  --moss:#3E5C3A; --amber:#9A5B12; --amber-soft:#E3C58C; --night:#1E1F2A; --line:#D9CDB8;
  --f-display:'Gowun Batang', 'Nanum Myeongjo', serif;
  --f-body:'Noto Sans KR', system-ui, sans-serif;
  --f-hand:'Nanum Pen Script', 'Gowun Batang', cursive;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.hud{position:absolute;left:0;right:0;top:0;padding-top:max(10px, env(safe-area-inset-top,0px));padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(244,237,224,.94);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.name{font-family:var(--f-display);font-weight:700;font-size:17px}
.sub{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.era{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:110px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--moss);color:var(--paper)}
.prog{width:110px;height:6px;border-radius:3px;background:#DCD2C0;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--amber)}
.stats{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;gap:5px;align-items:baseline;padding:5px 9px;border-radius:12px;background:rgba(244,237,224,.92);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-size:13px}
.hint{pointer-events:auto;align-self:center;max-width:min(92%,460px);padding:7px 12px;border-radius:12px;background:rgba(42,38,32,.86);color:var(--paper);font-size:13px;text-align:center}
.tools{position:absolute;left:0;right:0;bottom:0;padding-bottom:max(12px, env(safe-area-inset-bottom,0px));padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.toolrow{pointer-events:auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:6px;background:var(--ink);border-radius:20px;width:min(100%,520px)}
.tool{appearance:none;border:0;background:transparent;color:var(--paper);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;min-height:54px;border-radius:14px;cursor:pointer}
.tool svg{width:22px;height:22px}
.tool[aria-pressed="true"]{background:var(--moss)}
.tool:focus-visible,.btn:focus-visible,.card:focus-visible{outline:3px solid var(--amber-soft);outline-offset:2px}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:72%;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:14px max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;overflow:auto;z-index:5}
.sheet h2{margin:0;font-family:var(--f-display);font-size:20px}
.sheet .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{appearance:none;border:0;background:var(--paper-2);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{appearance:none;text-align:left;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-height:44px}
.card[disabled]{opacity:.55;cursor:not-allowed;background:#EDE5D6}
.card b{font-size:14px}.card span{font-size:12px;color:var(--ink-2)}
.btn{appearance:none;border:0;font:inherit;font-weight:700;font-size:14px;padding:0 14px;min-height:46px;border-radius:14px;background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--moss)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:20px;height:20px;accent-color:var(--moss)}
.parch{background:#F1E4C8;border-radius:8px;padding:12px 14px;box-shadow:inset 0 0 30px rgba(122,90,50,.3);display:flex;flex-direction:column;gap:8px}
.entry{display:flex;flex-direction:column}
.entry small{font-size:11px;font-weight:700;color:#6E5233}
.entry span{font-family:var(--f-hand);font-size:21px;line-height:1.2;color:#2E241A}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:rgba(42,38,32,.92);color:var(--paper);padding:9px 14px;border-radius:12px;font-size:13px;max-width:86%;text-align:center;pointer-events:none;z-index:6}
.overlay{position:absolute;inset:0;background:rgba(20,20,28,.78);display:flex;align-items:center;justify-content:center;z-index:8;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.overlay .box{background:var(--paper);border-radius:18px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.overlay .box h3{margin:0;font-family:var(--f-display);font-size:20px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv b{text-align:right}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">

    </div>
  </div>

  <section class="sheet" id="buildSheet" hidden aria-label="건설">
    <div class="row"><h2>무엇을 지을까요</h2><button class="x" type="button" data-close="buildSheet" aria-label="닫기">✕</button></div>
    <div class="sub">고른 뒤 땅을 누르면 거기에 터가 생겨요. 주민들이 자재를 날라와 짓습니다.</div>
    <label class="toggle"><input type="checkbox" id="autoBuild" checked> 주민 자율 건설 (촌장이 필요한 건물을 알아서 짓기)</label>
    <div class="grid" id="buildGrid"></div>
  </section>

  <section class="sheet" id="bookSheet" hidden aria-label="연대기">
    <div class="row"><h2>초록방울 연대기</h2><button class="x" type="button" data-close="bookSheet" aria-label="닫기">✕</button></div>
    <div class="parch" id="bookList"></div>
  </section>

  <section class="sheet" id="awaySheet" hidden aria-label="자리 비우기">
    <div class="row"><h2>거인이 자리를 비우면</h2><button class="x" type="button" data-close="awaySheet" aria-label="닫기">✕</button></div>
    <div class="sub">앱을 끈 것처럼 시간을 흘려봅니다. 주민들은 알아서 먹고, 짓고, 아이를 낳아요. 대신 문명 발전은 30% 속도이고, 시대는 거인이 돌아와야 바뀝니다.</div>
    <div class="btns" id="awayBtns"></div>
  </section>

  <section class="sheet" id="personSheet" hidden aria-label="주민 정보">
    <div class="row"><h2 id="pName">—</h2><button class="x" type="button" data-close="personSheet" aria-label="닫기">✕</button></div>
    <div class="kv" id="pInfo"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="overlay" hidden><div class="box" id="overlayBox"></div></div>
</div>

<script>
(() => {
'use strict';
// ───────────────────────── 상수 (밸런스 v1 · 건물 명세 v1) ─────────────────────────
const DAY = 86400, HOUR = 3600;
const R = 32;                 // 소형 병 안쪽 대지 반지름 (지름 64칸)
const TILT = 0.58;            // 비스듬히 내려다보는 각도
const FOOD_IV = 900;          // 1명이 15분마다 식량 1
const BIRTH_RATE = 0.6;       // 부부당 하루 출생
const MAX_POP = 40;
const GROW_FIRST = 4 * HOUR;  // 새 밭 첫 수확까지
const WALK = 1.25;            // 칸/초
const ERA_NEED = 100;
const OFFLINE_ERA = 0.3;
const SPEEDS = [1, 10, 60, 600];
// 병 안의 기후 지도 (병 자체의 설계):
// · 빛은 북서쪽 유리(거인의 창가)로 들어온다 → 그쪽은 늘 따뜻하다.
// · 뚜껑 안쪽의 '물방울 돌기' 아래로만 거대한 물방울이 똑똑 떨어진다 → 그 자리에 강 없는 호수.
// · 돌기가 없는 곳은 김이 뚜껑 경사를 타고 유리벽으로 흘러내린다 → 강은 유리벽에서 시작해 안쪽 습지로 스며든다.
const LIGHT = {x: -0.72, y: -0.69};
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const sunward = (x, y) => (x * LIGHT.x + y * LIGHT.y) / R;           // -1 (그늘 끝) ~ 1 (창가)
function warmth(x, y) { return clamp01(0.5 + 0.55 * sunward(x, y)); }   // 0 추움 ~ 1 따뜻함
function wetness(x, y) {
  if (!S || !S.wetC) return 0.3;
  const k = cellIdx(x, y); return clamp01(0.12 + S.wetC[k] * 0.9 - 0.1 * sunward(x, y));
}
const saltAt = (x, y) => (S && S.salt ? S.salt[cellIdx(x, y)] : 0);
function farmMult(x, y) { const w = warmth(x, y), m = wetness(x, y), sl = saltAt(x, y); return Math.max(0.15, Math.min(1.5, (0.6 + 0.6 * w) * (0.65 + 0.7 * m) / (1 + sl * 300))); }
function climateText(x, y) {
  const w = warmth(x, y), m = wetness(x, y);
  const sl = saltAt(x, y);
  return `${w > 0.66 ? '따뜻함' : w > 0.36 ? '선선함' : '서늘함'} · ${m > 0.6 ? '물가라 촉촉함' : m > 0.35 ? '촉촉함' : '건조함'}${sl > 0.003 ? ' · 소금기 많음' : ''}`;
}

const DEF = {
  '창고':   {plank:4, stone:2, time:120, era:0, size:1.5, color:'#B08A5A', desc:'물자 보관'},
  '오두막': {plank:2, stone:0, time:60,  era:0, size:1.0, cap:4, color:'#E9DFCD', desc:'4명이 사는 집'},
  '나무꾼': {plank:2, stone:0, time:60,  era:0, size:0.9, job:true, color:'#C9A36B', desc:'나무 → 통나무 (숲 옆)'},
  '산림관': {plank:2, stone:0, time:60,  era:0, size:0.9, job:true, color:'#9DB37A', desc:'나무를 다시 심음'},
  '채석장': {plank:2, stone:0, time:60,  era:0, size:0.9, job:true, color:'#A7A39A', desc:'바위 → 돌 (바위 옆)'},
  '제재소': {plank:2, stone:2, time:120, era:0, size:1.2, job:true, in:{'통나무':1}, out:{'판자':1}, cycle:30, color:'#C08A55', desc:'통나무 1 → 판자 1'},
  '농장':   {plank:3, stone:1, time:120, era:0, size:1.8, job:true, out:{'밀':1}, cycle:60, color:'#D8B44A', desc:'밀 1/분 · 첫 수확 4시간'},
  '우물':   {plank:0, stone:2, time:60,  era:0, size:0.7, job:true, out:{'물':1}, cycle:30, color:'#8FA9B5', desc:'물 2/분'},
  '방앗간': {plank:3, stone:3, time:150, era:1, size:1.2, job:true, in:{'밀':1}, out:{'밀가루':1}, cycle:30, color:'#D9CDB8', desc:'밀 → 밀가루'},
  '빵집':   {plank:2, stone:3, time:150, era:1, size:1.2, job:true, in:{'밀가루':1,'물':1}, out:{'빵':1}, cycle:30, color:'#E2B07A', desc:'밀가루+물 → 빵'},
  '목조주택': {plank:4, stone:1, time:120, era:1, size:1.2, cap:6, color:'#E0D2B8', desc:'6명이 사는 집'},
  '소금밭':  {plank:2, stone:0, time:60,  era:0, size:1.0, job:true, out:{'소금':1}, cycle:90, color:'#EDE8DA', desc:'마른 호수 바닥의 소금 캐기 (소금 들판 위에)'},
};
const ERAS = ['개척기', '마을'];
// 창고에 이만큼 넘게 있으면 그 물자 생산을 쉬고 다른 일을 돕는다
const ENOUGH = {'통나무': 20, '판자': 40, '돌': 30, '물': 20, '밀가루': 20, '소금': 40};
const FOODS = ['건량', '빵', '밀'];  // 창고 식량 (낟알은 따로)
const NAMES_M = ['브루노','디터','에밀','구스타프','요나스','루카스','니코','오스카','지몬','파울','막스','한네스','테오','빌리'];
const NAMES_F = ['아다','클라라','프리다','하나','이다','카타','미아','파울라','로사','테아','우르슬라','빌마','엘라','넬레'];
const TRAITS = [
  ['노래하며 일함', '주변 기분이 좋아짐', 1.0],
  ['부지런함', '일이 빠름', 1.2],
  ['느긋함', '일이 조금 느림', 0.85],
  ['손이 큼', '가끔 하나 더 만듦', 1.1],
  ['새벽형', '아침에 힘이 남', 1.05],
  ['겁쟁이지만 손이 빠름', '빠르지만 하늘 소리에 숨음', 1.2],
  ['할머니 레시피를 기억함', '음식 솜씨', 1.0],
  ['거인의 손가락을 본 적 있다고 우김', '믿음이 깊음', 1.0],
  ['고양이만 보면 따라감', '가끔 딴짓', 0.9],
  ['망치 소리로 박자를 맞춤', '건설이 빠름', 1.15],
  ['절대 뛰지 않음', '느리지만 다치지 않음', 0.9],
  ['짐을 많이 들 수 있음', '한 번에 더 나름', 1.1],
];

// ───────────────────────── 난수 (시드 고정) ─────────────────────────
let seed = 20261105;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const pick = (a) => a[Math.floor(rnd() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ───────────────────────── 지형과 물 (높낮이 + 흐르는 물) ─────────────────────────
// 64×64 칸 높이 지도. 물은 높은 곳 → 낮은 곳으로 흐르고, 오목한 곳에 고이면 호수, 넘치면 새 강.
// 물이 들어오는 곳: 뚜껑 물방울 돌기(호수 위), 그늘 쪽 유리벽(벽을 타고 흘러내림).
// 물이 나가는 곳: 증발(따뜻할수록 많이), 얕은 물은 땅에 스며듦. 병은 닫혀 있어 그 밖엔 없다.
const N = 64, CELL = 2 * R / N;
const cellIdxRaw = (x, y) => { const i = Math.max(0, Math.min(N - 1, Math.floor((x + R) / CELL))), j = Math.max(0, Math.min(N - 1, Math.floor((y + R) / CELL))); return j * N + i; };
const cellIdx = (x, y) => { const i = Math.max(0, Math.min(N - 1, Math.floor((x + R) / CELL))), j = Math.max(0, Math.min(N - 1, Math.floor((y + R) / CELL))); return j * N + i; };
const cellX = (k) => -R + (k % N + 0.5) * CELL, cellY = (k) => -R + (Math.floor(k / N) + 0.5) * CELL;
let HY = null;   // 저장하지 않는 계산용 표 (칸 목록·이웃·따뜻함·벽 칸)
function heightAt(x, y) {

function foodTotal() {

      log('들에서 첫 곡식을 거둔 다음 날, 하늘의 낟알이 그쳤다. 이제 우리는 우리 손으로 먹고산다.');

  if (b.type === '빵집' || (DEF[b.type].cap && occupants(b))) { ctx.strokeStyle = 'rgba(210,205,195,0.7)'; ctx.lineWidth = 2; ctx.beginPath(); const sy0 = y - hh - w * 0.3; ctx.moveTo(x + w * 0.25, sy0); ctx.quadraticCurveTo(x + w * 0.35, sy0 - 8, x + w * 0.25, sy0 - 16); ctx.stroke(); }

function label(t, x, y) { ctx.font = "600 11px 'Noto Sans KR', sans-serif"; const w = ctx.measureText(t).width + 10; ctx.fillStyle = 'rgba(244,237,224,0.85)'; ctx.fillRect(x - w / 2, y - 9, w, 15); ctx.fillStyle = '#2A2620'; ctx.textAlign = 'center'; ctx.fillText(t, x, y + 2); ctx.textAlign = 'left'; }
const JOBCOL = {'나무꾼': '#6E8F3A', '산림관': '#7FA35C', '채석장': '#7A7F86', '제재소': '#A0703E', '농장': '#C9A23A', '우물': '#4F7FA0', '방앗간': '#B7A98E', '빵집': '#C9824A'};
function drawPerson(p) {
  const z = S.cam.z, x = sx(p.x), y = sy(p.y), k = p.age < 1 ? 0.45 : p.age < 4 ? 0.65 : 1;
  const s = Math.max(3, z * 0.22) * k;
  if (p.sleeping && homeOf(p) && Math.hypot(p.x - homeOf(p).x, p.y - homeOf(p).y - 0.3) < 0.2) return; // 집 안
  const job = p.job ? bld(p.job) : null;
  ctx.fillStyle = job ? (JOBCOL[job.type] || '#5A5247') : p.age >= 20 ? '#7d7466' : p.age < 4 ? '#c9b48a' : '#8a6a52';
  ctx.beginPath(); ctx.ellipse(x, y - s * 1.2, s * 0.75, s * 1.15, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#E8C4A0'; ctx.beginPath(); ctx.arc(x, y - s * 2.7, s * 0.65, 0, Math.PI * 2); ctx.fill();
  if (p.sleeping) { ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = "11px 'Noto Sans KR'"; ctx.fillText('z', x + s, y - s * 3); }
  if (p.carry) { ctx.fillStyle = p.carry === '낟알' ? '#FFFBEA' : p.carry === '돌' ? '#9AA6A8' : p.carry === '밀' ? '#D8B44A' : '#C08A55'; ctx.fillRect(x - s * 0.7, y - s * 4.4, s * 1.4, s * 0.9); }
  if (selected === p.id) { ctx.strokeStyle = '#E3C58C'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(x, y, s * 1.6, s * 0.7, 0, 0, Math.PI * 2); ctx.stroke(); }
}
function drawBubble(x, y, text) {
  const w = ctx.measureText(text).width + 14, h = 24;
  ctx.fillStyle = 'rgba(255,251,240,0.95)'; ctx.strokeStyle = 'rgba(42,38,32,0.25)'; ctx.lineWidth = 1;

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ───────────────────────── UI ─────────────────────────
let buildPick = null, hoverW = null, selected = null, rainMode = false;
let GROUND = null;
function buildGround() {
  const out = [], h = S.h, L = Math.hypot(LIGHT.x, LIGHT.y, 1.2);
  for (const k of HY.cells) {
    const i = k % N, j = Math.floor(k / N), x = cellX(k), y = cellY(k);
    const hx = (h[j * N + Math.min(N - 1, i + 1)] - h[j * N + Math.max(0, i - 1)]) / (2 * CELL), hy = (h[Math.min(N - 1, j + 1) * N + i] - h[Math.max(0, j - 1) * N + i]) / (2 * CELL);
    const nx = -hx * 6, ny = -hy * 6, nl = Math.hypot(nx, ny, 1);
    const shade = (nx * LIGHT.x + ny * LIGHT.y + 1.2) / (nl * L);                // 빛을 받는 비탈은 밝게
    const wv = warmth(x, y), m = wetness(x, y);
    let c = mixHex(mixHex('#6b9459', '#c2c070', wv), '#4c7d56', Math.min(0.8, Math.max(0, m - 0.3)));
    if (S.salt && S.salt[k] > 0.0015 && S.w[k] < 0.004) c = mixHex(c, '#ece7da', Math.min(1, S.salt[k] * 180));   // 마른 호수 바닥의 소금
    const lift = 0.78 + 0.32 * shade + 0.25 * (h[k] - 0.15);
    const cont = Math.floor(h[k] * 14) !== Math.floor(h[Math.min(N * N - 1, k + 1)] * 14) || Math.floor(h[k] * 14) !== Math.floor(h[Math.min(N * N - 1, k + N)] * 14);
    out.push({x: x - CELL / 2, y: y - CELL / 2, c: scaleHex(c, lift * (cont ? 0.9 : 1) * (S.salt && S.salt[k] > 0.0015 && S.w[k] < 0.004 ? 1.08 : 1)), cs: CELL});

}
function scaleHex(hex, f) { const p = parseInt(hex.slice(1), 16); return '#' + [16, 8, 0].map(sh => Math.max(0, Math.min(255, Math.round(((p >> sh) & 255) * f))).toString(16).padStart(2, '0')).join(''); }
function renderHud() {
  document.getElementById('clock').textContent = `${fmtTime(S.t)} · ${partOfDay()}`;
  document.getElementById('eraName').textContent = ERAS[S.era];
  document.getElementById('eraBar').style.width = (S.era >= ERAS.length - 1 ? 100 : S.eraPts / ERA_NEED * 100) + '%';
  const food = Math.floor(foodTotal());
  const chips = [['인구', `${alive().length}/${MAX_POP}`], ['식량', food], ['판자', Math.floor(S.stock['판자'])], ['돌', Math.floor(S.stock['돌'])], ['통나무', Math.floor(S.stock['통나무'])], ['도구', S.stock['도구']], ['소금', S.saltKnown ? Math.floor(S.stock['소금'] || 0) : '?'], ['믿음', Math.round(S.faith) + '%'], ['의심', doubters().length + '명']];
  document.getElementById('stats').innerHTML = chips.map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join('');
  let hint = '';
  const has = (t) => S.b.some(b => b.type === t);
  if (S.eraPts >= ERA_NEED && S.era < ERAS.length - 1) hint = '<button class="btn" type="button" id="revBtn" style="min-height:36px">거인의 계시 내리기 → 마을 시대</button>';
  else if (!has('오두막')) hint = '밤이 추워요. [건설]에서 오두막을 지어주세요.';
  else if (!has('농장')) hint = '농장을 지으면, 첫 수확 뒤 하늘 낟알이 그쳐요.';
  else if (S.firstHarvestAt === null) { const f = S.b.find(b => b.type === '농장' && b.built); hint = f ? `밀이 자라는 중… 첫 수확까지 ${Math.max(0, Math.ceil((f.readyAt - S.t) / 60))}분` : '농장을 짓는 중이에요.'; }
  else if (S.deficit > 0) hint = '창고가 비었어요! 농장을 더 지어주세요.';
  else hint = `주민들이 ${alive().filter(p => !p.sleeping).length}명 깨어 있어요. 사람을 누르면 무엇을 하는지 보여요.`;
  if (buildPick && hoverW && Math.hypot(hoverW.x, hoverW.y) < R) hint = `${buildPick} 자리 — ${climateText(hoverW.x, hoverW.y)}${buildPick === '농장' ? ` · 농사 ×${farmMult(hoverW.x, hoverW.y).toFixed(1)}` : ''}`;

function renderBuild() {

    const noSalt = k === '소금밭' && !S.saltKnown, locked = d.era > S.era || noSalt;
    return `<button class="card" type="button" data-b="${k}" ${locked ? 'disabled' : ''}><b>${k}</b><span>${d.desc}</span><span>판자 ${d.plank} · 돌 ${d.stone}${noSalt ? ' · 소금을 발견하면 열림' : d.era > S.era ? ' · 마을 시대에 열림' : ''}</span></button>`;
  }).join('');
  grid.querySelectorAll('[data-b]').forEach(el => el.onclick = () => { buildPick = el.dataset.b; closeSheets(); toast(`${buildPick}: 지을 곳을 누르세요`); setPressed('tBuild', true); });
}
function renderBook() {
  document.getElementById('bookList').innerHTML = S.book.slice().reverse().slice(0, 80).map(e => `<div class="entry"><small>${fmtTime(e.t)}</small><span>${esc(e.text)}</span></div>`).join('');
}
function renderPerson() {
  const p = person(selected); if (!p || p.dead) { selected = null; closeSheets(); return; }
  document.getElementById('pName').textContent = p.name;
  const job = p.job ? bld(p.job).type : (p.age < 4 ? '아이' : p.age >= 20 ? '노인 (은퇴)' : '일거리 찾는 중');

  const rows = [['나이', `${Math.round(p.age * 2.4)}세`], ['특징', p.trait], ['', p.tdesc], ['직업', job], ['지금', p.doing], ['배우자', partner], ['집', p.home ? bld(p.home).type : '없음 (모닥불)'], ['여기 날씨', climateText(p.x, p.y)], ['믿음', p.belief < 0.3 ? '거인을 믿지 않음' : p.belief < 0.6 ? '반신반의' : '거인님을 믿음'], ['배고픔', p.hunger < 0.5 ? '배부름' : p.hunger < 2 ? '조금 출출' : '굶주림'], ['건강', Math.round(p.health * 100) + '%']];

}
function setPressed(id, v) { document.getElementById(id).setAttribute('aria-pressed', v ? 'true' : 'false'); }
function closeSheets() { for (const id of ['buildSheet', 'bookSheet', 'awaySheet', 'personSheet']) document.getElementById(id).hidden = true; }

document.querySelectorAll('[data-close]').forEach(el => el.onclick = () => { document.getElementById(el.dataset.close).hidden = true; if (el.dataset.close === 'personSheet') selected = null; });
document.getElementById('tBuild').onclick = () => { if (buildPick) { buildPick = null; setPressed('tBuild', false); return; } rainMode = false; setPressed('tRain', false); renderBuild(); openSheet('buildSheet'); };
document.getElementById('tTap').onclick = () => giantTap();
document.getElementById('tTurn').onclick = () => { if (!busy) rotateJar(); };
document.getElementById('tRain').onclick = () => { rainMode = !rainMode; buildPick = null; setPressed('tBuild', false); setPressed('tRain', rainMode); if (rainMode) toast('기적: 물을 뿌릴 곳을 누르세요'); };
document.getElementById('tSpeed').onclick = () => { S.speedIdx = (S.speedIdx + 1) % SPEEDS.length; renderHud(); };

document.getElementById('tAway').onclick = () => { openSheet('awaySheet'); };
document.getElementById('awayBtns').innerHTML = [[1, '1시간'], [8, '8시간'], [24, '하루'], [72, '3일'], [168, '일주일']].map(([h, l]) => `<button class="btn ghost" type="button" data-h="${h}">${l}</button>`).join('');
document.querySelectorAll('[data-h]').forEach(el => el.onclick = () => goAway(+el.dataset.h));

// 포인터: 드래그 = 둘러보기, 두 손가락 = 확대, 누르기 = 선택/짓기/비
const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, {x: e.offsetX, y: e.offsetY}); if (ptrs.size === 1) drag = {x: e.offsetX, y: e.offsetY, cx: S.cam.x, cy: S.cam.y, moved: false}; else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), z: S.cam.z}; drag = null; } });
cv.addEventListener('pointermove', (e) => {
  hoverW = toWorld(e.offsetX, e.offsetY);
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, {x: e.offsetX, y: e.offsetY});
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; S.cam.z = clampZ(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); return; }
  if (drag) { const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y; if (Math.hypot(dx, dy) > 6) drag.moved = true; if (drag.moved) { S.cam.x = drag.cx - dx / S.cam.z; S.cam.y = drag.cy - dy / (S.cam.z * TILT); clampCam(); } }
});
cv.addEventListener('pointerup', (e) => {
  const wasDrag = drag && drag.moved; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0) { if (!wasDrag && drag) tapAt(e.offsetX, e.offsetY); drag = null; }
});
cv.addEventListener('pointercancel', (e) => { ptrs.delete(e.pointerId); drag = null; pinch = null; });
cv.addEventListener('wheel', (e) => { e.preventDefault(); S.cam.z = clampZ(S.cam.z * (e.deltaY < 0 ? 1.12 : 0.89)); }, {passive: false});
const clampZ = (z) => Math.max(6, Math.min(60, z));
function clampCam() { const d = Math.hypot(S.cam.x, S.cam.y); if (d > R) { S.cam.x *= R / d; S.cam.y *= R / d; } }
function tapAt(px, py) {

  if (rainMode) { giantRain(w.x, w.y); rainMode = false; setPressed('tRain', false); return; }
  // 사람 고르기 (화면 거리)
  let best = null, bd = 28;
  for (const p of alive()) { const d = Math.hypot(sx(p.x) - px, sy(p.y) - S.cam.z * 0.5 - py); if (d < bd) { bd = d; best = p; } }
  if (best) { selected = best.id; renderPerson(); openSheet('personSheet'); }
}

// ───────────────────────── 루프 · 시작 ─────────────────────────
let last = performance.now();
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!busy) { let gdt = real * SPEEDS[S.speedIdx]; while (gdt > 0) { const d = Math.min(gdt, SPEEDS[S.speedIdx] >= 600 ? 4 : 1); step(d); gdt -= d; } }
  draw();
  if (now - (frame.hudAt || 0) > 250) { renderHud(); frame.hudAt = now; }
  requestAnimationFrame(frame);
}
function start(data) {

  resize(); window.addEventListener('resize', () => { resize(); });
  renderHud(); renderBuild();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => { try { return {S: JSON.parse(JSON.stringify({...S, paths: Array.from(S.paths), h: Array.from(S.h), w: Array.from(S.w), flux: Array.from(S.flux), wetC: Array.from(S.wetC), salt: Array.from(S.salt), p: S.p.map(q => ({...q, steps: []}))}))}; } catch (e) { return {}; } });
// 시험용 훅 (프로토타입 확인용)
window.__proto = {get S() { return S; }, step, goAway, alive};

})();
